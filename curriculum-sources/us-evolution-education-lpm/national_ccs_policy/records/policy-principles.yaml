  - id: USLP-PRINCIPLE-landmark-rulings-get-redesigned-around-not-defeated
    slug: landmark-rulings-get-redesigned-around-not-defeated
    label: A landmark ruling changes what the next legislative attempt looks like; it rarely ends the underlying attempt
    domain: computational-curriculum-studies
    jurisdictionScope: US
    statement: >
      Epperson (1968) ended outright teaching bans. Edwards (1987) ended
      explicit "creation science" mandates. Neither ruling ended the
      underlying legislative effort to protect a religiously-motivated
      alternative to evolution in public education -- each one instead
      produced a next-generation template, engineered specifically to avoid
      the exact legal defect the ruling identified, with Tennessee's 2012
      law (still standing, untested) as the clearest documented example in
      this ecosystem so far.
    rationale: >
      Grounded directly in USLP-FINDING-edwards-reasoning-vs-2012-tennessee-law
      and tennessee-lpm's own parallel finding -- this is a pattern this
      ecosystem's own research actually traced across two real rulings and
      three real statutes, not a general claim about litigation's limits
      stated in the abstract.
    groundedIn:
      - USLP-FINDING-edwards-reasoning-vs-2012-tennessee-law
      - USLP-MANDATE-edwards-v-aguillard
