principles:
  - id: USLP-PRINCIPLE-a-national-pattern-is-not-a-national-rule
    slug: a-national-pattern-is-not-a-national-rule
    label: A real, documented national pattern is not the same thing as a single national rule, and a curriculum archive should keep the two distinct
    domain: computational-curriculum-studies
    jurisdictionScope: US
    statement: >
      Two US Supreme Court rulings genuinely bind every state at once on
      this question. Everything else this ecosystem has documented --
      Florida's recurring state fights, Pennsylvania's district-level
      litigation, Tennessee's century of statutes -- is a separate,
      independently-adjudicated dispute in its own jurisdiction, connected
      to the others only by a real, documented, continuous underlying
      question, not by a shared legal proceeding or a single governing
      body. `policy-controversy-record.controversyType: cross-jurisdiction-pattern`
      exists specifically so a curriculum-policy archive can name that kind
      of connection honestly, without either ignoring it (treating each
      state as if it had no relationship to the others) or overstating it
      (writing as if "the United States" itself were one single disputing
      party with one single legal outcome, the way a single state's own
      controversy record legitimately can be written).
    rationale: >
      This is the single structural lesson of this repo's own founding: the
      three state repos, each internally accurate and complete, were
      genuinely missing a layer that is distinct from any one of them --
      and building that layer required one new schema value
      (`cross-jurisdiction-pattern`) and one new field (`crossRepoRefs`),
      not a restructuring of anything already built.
    groundedIn:
      - USLP-CONTROVERSY-american-evolution-education-culture-war
      - USLP-MANDATE-epperson-v-arkansas
      - USLP-MANDATE-edwards-v-aguillard
