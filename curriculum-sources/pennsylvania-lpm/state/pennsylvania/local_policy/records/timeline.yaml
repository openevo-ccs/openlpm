  - id: PALP-EVENT-kitzmiller-trial
    slug: kitzmiller-trial
    label: Kitzmiller v. Dover trial held before Judge John E. Jones III
    jurisdiction: US
    eventType: other
    dateStart: "2005-09-26"
    dateEnd: "2005-11-04"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Six weeks of testimony in Harrisburg, PA, before Judge John E. Jones
      III (US District Court, Middle District of Pennsylvania; a George W.
      Bush appointee). Plaintiffs' expert witnesses included Kenneth R.
      Miller (Brown University), Barbara Forrest (SE Louisiana University --
      testified on the "cdesign proponentsists" find-and-replace artifact in
      draft manuscripts of "Of Pandas and People"), Kevin Padian, Robert
      Pennock, John Haught, Brian Alters. Defense expert witnesses Michael
      Behe (Lehigh University) and Scott Minnich (University of Idaho)
      testified on "irreducible complexity" (the bacterial flagellum
      argument); three other Discovery-Institute-affiliated experts (William
      Dembski, Stephen Meyer, John Angus Campbell) had withdrawn before
      depositions.
    involvedActors:
      - PALP-ACTOR-dover-area-school-district
      - PALP-ACTOR-discovery-institute
    sourceUrl: https://ncse.ngo/kitzmiller-trial-transcripts
    accessTier: excerpt-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        NPR, "Pa. Case Weighs Intelligent Design in Schools" (Sept 26 2005);
        NCSE's trial transcript index; TalkOrigins trial-transcript archive
        (Day 1 AM, Day 11 PM) -- all fetched and read directly.

