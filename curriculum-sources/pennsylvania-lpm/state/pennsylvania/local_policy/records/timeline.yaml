  - id: PALP-EVENT-kitzmiller-ruling
    slug: kitzmiller-ruling
    label: Judge Jones rules the intelligent-design policy unconstitutional
    jurisdiction: US
    eventType: court-ruling
    dateStart: "2005-12-20"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Judge John E. Jones III issued a 139-page opinion, Kitzmiller v. Dover
      Area School District, 400 F. Supp. 2d 707 (M.D. Pa. 2005). Found
      intelligent design is not science (it invokes a supernatural designer,
      "a hallmark of a religious, rather than scientific, position") and is a
      form of creationism relabeled (citing the "cdesign proponentsists"
      evidence); applied both the Lemon v. Kurtzman test and the endorsement
      test to find the board acted with religious intent, violating the
      Establishment Clause. Wrote: "The breathtaking inanity of the Board's
      decision is evident when considered against the factual backdrop which
      has now been fully revealed through this trial." Found board members
      Buckingham and Bonsell gave false testimony denying the policy's
      religious origins. Not appealed.
    involvedActors: [PALP-ACTOR-dover-area-school-district]
    sourceUrl: https://ncse.ngo/files/pub/legal/kitzmiller/highlights/2005-12-20_Kitzmiller_decision.pdf
    accessTier: excerpt-only
    licenseOrRightsNote: >
      A federal court's own published opinion is a public judicial record.
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        The opinion itself (NCSE-hosted PDF and Justia); TIME, "'Breathtaking
        Inanity': How Intelligent Design Flunked Its Test Case" (2005) --
        both fetched and read directly.

