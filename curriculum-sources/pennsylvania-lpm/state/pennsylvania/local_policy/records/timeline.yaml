  - id: PALP-EVENT-dover-2004-10-18-board-vote
    slug: dover-2004-10-18-board-vote
    label: Dover board votes 6-3 to adopt the intelligent-design curriculum policy; two members resign in protest
    jurisdiction: US-PA
    eventType: school-board-action
    dateStart: "2004-10-18"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      The Dover Area School Board voted 6-3 to amend the biology curriculum:
      "Students will be made aware of gaps/problems in Darwin's theory and of
      other theories of evolution including, but not limited to, intelligent
      design." FOR: Alan Bonsell, William Buckingham, Jane Cleaver, Heather
      Geesey, Sheila Harkins, Angie Ziegler-Yingling. AGAINST: Jeffrey Brown,
      Carol "Casey" Brown, Noel Wenrich. Jeff and Casey Brown (a married
      couple, board members 5 and 10 years respectively) resigned in protest
      at the end of the same meeting; Casey Brown's statement: "it has become
      increasingly evident that in the direction the board has now chosen to
      go, holding a certain religious belief is of paramount importance... I
      can no longer effectively function as a member of this board."
    involvedActors: [PALP-ACTOR-dover-area-school-district]
    sourceUrl: https://ncse.ngo/kitzmiller-v-dover-timeline
    accessTier: excerpt-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        NCSE, "Kitzmiller v. Dover Timeline" and "Design on Trial in Dover,
        Pennsylvania," both fetched and read directly, summarizing the trial
        record (Plaintiffs' Findings of Fact, talkorigins.org/faqs/dover/pf.html).

  - id: PALP-EVENT-dover-teachers-refuse-and-disclaimer-first-read
    slug: dover-teachers-refuse-and-disclaimer-first-read
    label: All 8 Dover biology teachers refuse to read the disclaimer; it is read by administrators instead
    jurisdiction: US-PA
    eventType: implementation-begins
    dateStart: "2005-01-06"
    dateEnd: "2005-01-18"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      All eight Dover High School science teachers sent the superintendent a
      letter stating intelligent design "is not science" and "not an
      accepted scientific theory," asking to be excused from reading the
      disclaimer since doing so would make them "violate the ethics code of
      [their] profession." They formally refused on Jan 6, 2005; the
      administration agreed (Jan 7) administrators would read it instead. The
      disclaimer was first read on Jan 18, 2005, by the assistant
      superintendent, in each 9th-grade biology classroom; roughly 15
      students walked out during the reading.
    involvedActors: [PALP-ACTOR-dover-area-school-district]
    sourceUrl: https://ncse.com/news/2005/01/dover-teachers-refuse-to-read-antievolution-disclaimer-00664
