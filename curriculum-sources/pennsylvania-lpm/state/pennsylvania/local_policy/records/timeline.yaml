$schema: ../../../../schema/policy-timeline-event.schema.json
$description: >
  Dated events in Pennsylvania's K-12 evolution-education policy history,
  spanning the state's own 2002 standards-wording fight and the Kitzmiller v.
  Dover Area School District case (2004-2006). See
  docs/source-notes/2026-10-20-pennsylvania-evolution-curriculum-policy-history-research.md
  for the full research this was built from.

events:
  - id: PALP-EVENT-pa-2000-2002-standards-wording-fight
    slug: pa-2000-2002-standards-wording-fight
    label: Pre-Dover PA state standards rulemaking fight over evolution-wording, resolved by final-form change
    jurisdiction: US-PA
    eventType: public-hearing
    dateStart: "2000-01-01"
    dateEnd: "2002-01-05"
    dateGranularity: year
    temporalStatus: past-completed
    description: >
      During rulemaking for Pennsylvania's first science standards to
      explicitly mention evolution, the proposed Standard 3.3.10.D required
      students to analyze records/studies "that support or do not support
      the theory of evolution." Over 120 individuals and organizations
      submitted public comments objecting the wording "inappropriately
      singled out" evolution and could "permit or even encourage schools to
      teach creationism or intelligent design"; the Independent Regulatory
      Review Commission also raised concern. The State Board changed the
      final-form language to "relevant to the theory of evolution" and
      stated it "did not intend to encourage the teaching of creationism or
      intelligent design."
    involvedActors:
      - PALP-ACTOR-pa-state-board-of-education
      - PALP-ACTOR-irrc
    sourceUrl: https://www.pacodeandbulletin.gov/Display/pabull?file=/secure/pabulletin/data/vol32/32-1/9.html
    accessTier: excerpt-only
    licenseOrRightsNote: >
      The Pennsylvania Bulletin is the Commonwealth's own official
      legal-notice publication, a public record.
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        Pennsylvania Bulletin, Vol. 32, Issue 1, Document No. 02-9, fetched
        and read directly.

  - id: PALP-EVENT-pa-2002-standards-adopted
    slug: pa-2002-standards-adopted
    label: Pennsylvania adopts "Academic Standards for Science and Technology" (22 Pa. Code, Ch. 4, App. B)
    jurisdiction: US-PA
    eventType: framework-adopted
    dateStart: "2002-01-05"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Final-form adoption of Pennsylvania's first science standards document
      to explicitly mention evolution at all, organized under heading 3.3
      Biological Sciences, subsection D. Evolution (grade-12 benchmark
      3.3.10.D: "analyze the theory of evolution"). This was the standards
      document in effect during the 2004-2005 Dover controversy -- Dover's
      own disclaimer explicitly invoked "the state standards" as the reason
      evolution had to be taught.
    involvedActors: [PALP-ACTOR-pa-state-board-of-education]
    sourceUrl: https://www.pacodeandbulletin.gov/Display/pabull?file=/secure/pabulletin/data/vol32/32-1/9.html
