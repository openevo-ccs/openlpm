  - id: PALP-EVENT-pa-hb1007-2005
    slug: pa-hb1007-2005
    label: Pennsylvania HB 1007 (2005) would have authorized intelligent-design teaching statewide; dies in committee
    jurisdiction: US-PA
    eventType: legislation
    dateStart: "2005-01-01"
    dateEnd: "2005-06-30"
    dateGranularity: month
    temporalStatus: past-completed
    description: >
      House Bill 1007 would have let local school boards add "intelligent
      design" to any curriculum that included evolution and let teachers
      introduce "supporting evidence" for ID. Got a hearing in the House
      Subcommittee on Basic Education in June 2005, while the Dover trial was
      underway, but never advanced further -- died in committee. No PA state
      "academic freedom act" targeting K-12 evolution instruction has ever
      passed, before or after Dover.
    involvedActors: []
    sourceUrl: https://ncse.ngo/evolution-pennsylvania
    accessTier: summary-only
    verificationStatus: unverified-secondary-source
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        The bill's prime sponsor could not be independently confirmed via
        primary PA legislative records this session (palegis.us has no
        accessible 2005-session archive entry for HB 1007); existence/content
        corroborated via NCSE's "Evolution in Pennsylvania" page and
        Wikipedia's "Anti-evolution legislation" article.
      sourceProvenance: NCSE, "Evolution in Pennsylvania," fetched and read directly.

  - id: PALP-EVENT-pa-2019-steels-review-begins
    slug: pa-2019-steels-review-begins
    label: Pennsylvania begins its first science-standards revision in 17 years
    jurisdiction: US-PA
    eventType: consultation-phase
    dateStart: "2019-01-01"
    dateGranularity: year
    temporalStatus: past-completed
    description: >
      Formal review launched 2019, developed with input from "over 900
      stakeholders," producing the new STEELS standards (Science, Technology
      & Engineering, Environmental Literacy & Sustainability) -- a title
      signaling environmental/sustainability content was the main addition,
      not evolution content. Pennsylvania's standards had gone 17 years
      without revision at that point (2002-2019), eventually 20 by adoption
      (2002-2022) -- the oldest in the country by replacement time.
    involvedActors:
      - PALP-ACTOR-pa-state-board-of-education
      - PALP-ACTOR-pde
    sourceUrl: https://whyy.org/articles/pa-hasnt-updated-science-education-standards-since-2002-new-plan-would-be-first-to-acknowledge-climate-change/
    accessTier: summary-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: WHYY, fetched and read directly.

