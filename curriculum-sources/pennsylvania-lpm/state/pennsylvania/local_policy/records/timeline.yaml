    description: >
      During the STEELS public-comment process, climate scientist Michael
      Mann publicly criticized a draft version's climate-change treatment.
      This -- not evolution content -- was the actual point of public debate
      during the 2019-2022 revision: PA's old 2002 standards had been graded
      "F" for climate change by NCSE's 2020 "Making the Grade?" report, while
