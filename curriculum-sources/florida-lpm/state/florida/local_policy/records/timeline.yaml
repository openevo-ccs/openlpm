  - id: FLLP-EVENT-county-school-board-resolutions-2007
    slug: county-school-board-resolutions-2007
    label: At least 12 Florida county school boards pass resolutions opposing the draft standards' treatment of evolution
    jurisdiction: US-FL
    eventType: school-board-action
    dateStart: "2007-11-01"
    dateEnd: "2007-12-31"
    dateGranularity: month
    temporalStatus: past-completed
    description: >
      Through November-December 2007, at least 12 Florida county school
      boards passed resolutions urging the State Board to revise the draft
      standards so evolution would not be "presented as fact." Named
      counties: Baker County (passed 5-0), Polk County, and Taylor County
      (Superintendent Oscar Howard named; Polk board member Kay Fields named
      in opposition). Organized opposition in this period also included
      Focus on the Family (joined November 2007), the Florida Baptist
      Witness (ran pieces against the draft, Nov 30 2007), and the Florida
      Family Policy Council.
    involvedActors: [FLLP-ACTOR-florida-family-policy-council]
    sourceUrl: https://ncse.ngo/evolution-comes-floridas-science-standards
