  - id: FLLP-EVENT-2026-draft-standards-released-for-comment
    slug: 2026-draft-standards-released-for-comment
    label: Draft 2026 K-12 science standards released for public comment
    jurisdiction: US-FL
    eventType: consultation-phase
    dateStart: "2026-09-25"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      FLDOE released its draft K-12 science standards rewrite for public
      comment. Reporting found the word "evolution" absent from the proposed
      high-school life-science standards entirely, and "climate change"/
      "global warming" absent from the draft anywhere (which retains "weather
      and climate," "climate systems," "climate impacts on biodiversity").
      The draft contains roughly 1,000 high-school science benchmarks and is
      not built on the National Research Council's 2012 Framework for K-12
      Science Education (the NGSS-aligned framework most other states now
      use). Public comment accepted via fldoe.org/standardsreview/.
    involvedActors: [FLLP-ACTOR-fldoe]
