  - id: FLLP-EVENT-ngsss-2008-state-board-vote
    slug: ngsss-2008-state-board-vote
    label: Florida State Board of Education votes 4-3 to adopt the Next Generation Sunshine State Standards
    jurisdiction: US-FL
    eventType: framework-adopted
    dateStart: "2008-02-19"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Days before the vote, under public and legislative pressure, Education
      Commissioner Eric Smith redrafted the standards to insert "the
      scientific theory of" before "evolution" (and before plate tectonics,
      cell theory, atomic theory, electromagnetism, and "scientific law of"
      before gravity) -- a late compromise ("Option B"). A further amendment
      proposed by board member Donna Callaway calling for "critical analysis"
      of evolution did NOT pass. The Board voted 4-3 to adopt the compromise
      version: YES -- T. Willard Fair (Chairman), Linda Taylor, Kathleen
      Shanahan, Phoebe Raulerson. NO -- Roberto Martinez (opposing because the
      compromise watered down the original, scientifically stronger draft,
      which the National Academy of Sciences had endorsed), Akshay Desai,
      Donna Callaway (opposing from the other direction, wanting weaker
      language than even the compromise). This was Florida's first standards
      document to explicitly name "evolution."
    involvedActors:
      - FLLP-ACTOR-florida-state-board-of-education
      - FLLP-ACTOR-fldoe
      - FLLP-ACTOR-florida-citizens-for-science
      - FLLP-ACTOR-national-academy-of-sciences
    sourceUrl: https://ncse.ngo/evolution-comes-floridas-science-standards
    accessTier: excerpt-only
    licenseOrRightsNote: >
      Quoted official vote/standards-text details are Florida government
      action/public record; named-actor quotes are short, attributed
      excerpts from contemporaneous news reporting (fair use / citation
      basis).
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        NCSE, "Evolution Comes to Florida's Science Standards" and "The
        e-word arrives in Florida" (both ncse.ngo), fetched and read directly
        (citing Orlando Sentinel, Miami Herald, AP, Education Week, St.
        Petersburg Times, Lakeland Ledger, Ft. Myers News-Press, Tallahassee
        Democrat, Florida Baptist Witness, all dated Feb 2008); independently
        corroborated by Education Week
        (edweek.org/teaching-learning/fla-panels-evolution-vote-hailed/2008/02),
        Science magazine (science.org/doi/10.1126/science.319.5867.1168), and
        NBC News.

