  - id: FLLP-EVENT-best-standards-2020-adoption-ela-math-only
    slug: best-standards-2020-adoption-ela-math-only
    label: State Board adopts B.E.S.T. Standards -- English Language Arts and Mathematics only, science untouched
    jurisdiction: US-FL
    eventType: framework-adopted
    dateStart: "2020-02-12"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Following Gov. DeSantis's Executive Order 19-32 (Jan 31, 2019)
      eliminating Common Core, the State Board formally adopted the new
      B.E.S.T. (Benchmarks for Excellent Student Thinking) Standards. B.E.S.T.
      Standards cover English Language Arts and Mathematics ONLY -- science
      (and social studies) were explicitly not rewritten in this process and
      continued under the existing 2008 NGSSS the entire time, confirmed by
      FLDOE's own B.E.S.T. Standards Overview document and by the Fordham
      Institute's 2020 review (which graded only ELA/Math, "weak" on both,
      with no science content because there was none to review). This is a
      correction to a plausible assumption that Florida's evolution standards
      changed in 2019-2020 -- they did not; SC.912.L.15 remained the
      governing 2008-era standard until the 2026 rewrite.
    involvedActors:
      - FLLP-ACTOR-florida-state-board-of-education
      - FLLP-ACTOR-fldoe
    sourceUrl: https://www.flgov.com/eog/news/press/2020/governor-ron-desantis-announces-floridas-new-best-k-12-standards
    accessTier: summary-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        One secondary source gives the State Board vote date as "January 12,
        2020" rather than February 12, 2020 -- a one-month discrepancy not
        resolved this session. The SCIENCE-UNTOUCHED finding itself is
        solidly corroborated (FLDOE's own July 20, 2020 Overview document,
        fldoe.org/file/7576/BESTStandardsOverview.pdf, and Fordham's own 2020
        review, ERIC ED606003, eric.ed.gov/?id=ED606003).
      sourceProvenance: >
        Gov. DeSantis's own announcement (flgov.com); FLDOE's B.E.S.T.
        Standards Overview; Fordham Institute, "The State of the Sunshine
        State Standards: Florida's B.E.S.T. Edition" (June 2020, ERIC
        ED606003) -- all cited directly, though the FLDOE Overview PDF and
        ERIC record were not independently re-fetched this session beyond
        confirming their existence via search.

  - id: FLLP-EVENT-2024-textbook-climate-content-removal
    slug: 2024-textbook-climate-content-removal
    label: FLDOE asks science-textbook publishers to reduce/remove climate-change content
    jurisdiction: US-FL
    eventType: other
    dateStart: "2024-06-01"
    dateEnd: "2024-08-31"
    dateGranularity: month
    temporalStatus: past-completed
    description: >
      In summer 2024, FLDOE asked publishers submitting science textbooks for
      state adoption to reduce or remove climate-change content; publishers
      complied. Teachers described a resulting "culture of caution"
      discouraging classroom discussion of climate topics, with some citing
      fear of professional retaliation. This operated through the ordinary
      textbook-adoption review process (the same process HB 989 opened to
      resident challenges in 2017) -- not a formal standards rewrite, and
      reported publicly only in 2026 via a joint investigation.
    involvedActors: [FLLP-ACTOR-fldoe, FLLP-ACTOR-ncse]
