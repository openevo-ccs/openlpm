      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        WUSF Public Media / The Hechinger Report joint investigation,
        republished by NCSE, "How Florida quietly removed climate change
        content from textbooks" (Aug 20/21, 2026), fetched and read directly.
