  - id: FLLP-EVENT-sb2692-hb1483-2008-academic-freedom-act
    slug: sb2692-hb1483-2008-academic-freedom-act
    label: "SB 2692 / HB 1483 \"Academic Freedom Act\" introduced, passes House, dies in Senate standoff"
    jurisdiction: US-FL
    eventType: legislation
    dateStart: "2008-01-01"
    dateEnd: "2008-05-02"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Sen. Ronda Storms (R-Valrico) introduced SB 2692 following Discovery
      Institute's model "Academic Freedom Act" statute; Rep. Alan Hays
      introduced the House companion HB 1483, narrowed to call for "thorough
      presentation and critical analysis of the scientific theory of
      evolution." John Stemberger (Florida Family Policy Council) was lead
      public advocate. Hays hosted a closed March 2008 press event with a
      Discovery Institute representative, for legislators only. The House
      passed its substituted version (HB 1483 text swapped into SB 2692) 71-43
      on April 28, 2008; the Senate rejected the substitution and restored its
      own text, sending it back to the House, which left it untouched -- the
      bill died at session's end without becoming law. This is the same
      Discovery Institute template later enacted in Louisiana (June 2008) and
      Tennessee (2012), but Florida's version did not pass.
    involvedActors:
      - FLLP-ACTOR-florida-legislature
      - FLLP-ACTOR-discovery-institute
      - FLLP-ACTOR-florida-family-policy-council
    sourceUrl: https://www.discovery.org/a/4510/
    accessTier: excerpt-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        The exact House/Senate procedural standoff in late April 2008 is
        described per a Tampa Tribune (April 29, 2008) account that was not
        independently fetched this session -- came via search synthesis. The
        vote count and the Discovery Institute/Stemberger/Hays roles ARE
        independently corroborated across Discovery Institute's own site,
        Florida Citizens for Science's news releases, and the Florida
        Senate's own bill-amendment record.
      sourceProvenance: >
        Discovery Institute, "Anti-Freedom Activists Try to Censor Science
        Education in Florida" (discovery.org/a/4510/); Evolution News,
        "Prepared Remarks for Florida Academic Freedom Bill Press Conference"
        (evolutionnews.org/2008/03/prepared_remarks_for_florida_a/); Florida
        Senate's own bill-amendment record
        (flsenate.gov/Session/Bill/2008/2692/Amendment/307351/PDF); Florida
        Citizens for Science news releases (flascience.org/wp/?p=529,
        /?p=534, /?p=547) -- all fetched and read directly.

  - id: FLLP-EVENT-hb989-2017-signed-into-law
    slug: hb989-2017-signed-into-law
    label: Gov. Rick Scott signs HB 989, the instructional-materials-objection law
    jurisdiction: US-FL
    eventType: legislation
    dateStart: "2017-06-26"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      CS/CS/HB 989, "Instructional Materials" (Rep. Byron Donalds, 20
      co-introducers), overhauled how Florida school districts review/adopt
      textbooks and let any Florida resident -- not just parents of enrolled
      students -- formally challenge a district's instructional materials,
      triggering a hearing before an independent review officer. Introduced
      March 7, 2017; passed House 94-25 (April 20, 2017); passed Senate 19-17
      (May 5, 2017; companion SB 1210 tabled); signed by Gov. Rick Scott June
      26, 2017; effective July 1, 2017 (Chapter law 2017-177). Not itself
      about evolution, but became the mechanism for the 2017-18 textbook
      challenges below.
