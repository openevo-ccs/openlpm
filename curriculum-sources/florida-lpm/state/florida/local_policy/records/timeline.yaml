  Dated events in Florida's K-12 science-curriculum policy history as it
  relates to evolution (and, where the same mechanism applies, climate
  change). See docs/source-notes/2026-10-20-florida-evolution-curriculum-policy-history-research.md
  for the full research this was built from, including confidence flags on
  specific dates/details noted per-event below via contributor_notes.

events:
  - id: FLLP-EVENT-sunshine-state-standards-1996-adoption
    slug: sunshine-state-standards-1996-adoption
    label: Florida Board of Education gives initial adoption to the first Sunshine State Standards
    jurisdiction: US-FL
    eventType: framework-adopted
    dateStart: "1996-05-01"
    dateGranularity: month
    temporalStatus: past-completed
    description: >
      Florida's first Sunshine State Standards, covering eight subjects
      including science, received initial adoption from the Florida Board of
      Education in May 1996 (development had begun in 1993). Secondary
      sources describe the original science standards as not using the term
      "evolution" at all, instead referring only to "biological change over
      time" -- a characterization attributed to then-Education Commissioner
      John Winn in a 2005 statement, though the Grades 9-12 standards did
      cover evolution-adjacent concepts (natural selection, mutation) without
      naming the theory itself.
    involvedActors: []
    sourceUrl: https://en.wikipedia.org/wiki/Sunshine_State_Standards
    accessTier: summary-only
    licenseOrRightsNote: >
      Florida state government standards text is a public record under Fla.
      Stat. ch. 119 and not subject to copyright (Microdecisions, Inc. v.
      Skinner, 889 So.2d 871 (Fla. 2d DCA 2004)) -- but the original 1996
      standards text itself was not located/fetched this session, so no
      verbatim excerpt is stored here; summary-only reflects that gap, not a
      rights restriction.
    verificationStatus: unverified-secondary-source
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        The "biological change over time" wording and the Winn quote came
        via AI-synthesized search summaries, not a document read directly;
        whether "1996" and "1999" (the year Fordham's 2005 report describes
        reviewing) refer to the same document or a revision is unresolved.
        See source-notes confidence flags 1-2.
      sourceProvenance: Wikipedia, "Sunshine State Standards" (bare adoption-date fact only).

  - id: FLLP-EVENT-fordham-2005-f-grade
    slug: fordham-2005-f-grade
    label: Fordham Foundation gives Florida's science standards an "F" for evolution treatment
    jurisdiction: US-FL
    eventType: other
    dateStart: "2005-01-01"
    dateGranularity: year
    temporalStatus: past-completed
    description: >
      The Thomas B. Fordham Foundation's national report "The State of State
      Science Standards 2005" (lead author Paul R. Gross) gave Florida's
      then-current science standards a failing grade, stating "The E-word is
      sedulously avoided" and "the superficiality of the treatment of
      evolutionary biology alone justifies the grade 'F.'" Evolution scored
      0; Florida was not singling out evolution for vague treatment -- plate
      tectonics, cell theory, atomic theory, electromagnetism, and the Big
      Bang received similarly superficial treatment.
    involvedActors: [FLLP-ACTOR-fordham-institute]
    sourceUrl: https://ncse.ngo/evolution-comes-floridas-science-standards
    accessTier: excerpt-only
    licenseOrRightsNote: >
      Short quotations from Fordham's report, as reproduced in NCSE's own
      articles (third-party commentary quoting a think-tank report) -- fair
      use / citation basis, not a government-text public-record claim.
    verificationStatus: unverified-secondary-source
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        Fordham's own 2005 PDF was not independently fetched this session --
        quotes came via NCSE's citation of it. Pull directly from
        edexcellence.net before treating as fully primary-confirmed.
      sourceProvenance: >
        NCSE, "Evolution Comes to Florida's Science Standards" and "Evolution
        in the Florida state science standards" (Oct 23, 2007), both fetched
        and read directly.

