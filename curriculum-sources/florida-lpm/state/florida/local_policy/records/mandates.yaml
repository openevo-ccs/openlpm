    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        CORRECTED 2026-10-20 (same session): this record originally quoted
        "[Evolution is] the fundamental concept underlying all of
        biology... supported by multiple forms of scientific evidence" as
        the standard's statementText, sourced only via a secondary
        characterization. Directly fetching the real Common Standards
        Project data found the standard's actual, exact statement at this
        structural level is simply "Diversity and Evolution of Living
        Organisms" (Common Standards Project asnIdentifier S1130831) -- no
        "fundamental concept"/"multiple forms of evidence" language exists
