    jurisdiction: US-FL
    issuingBody: Florida State Board of Education
    mandateType: state-board-adopted-standard
    statementText: >
      SC.912.L.15.10: Identify basic trends in hominid evolution from early
      ancestors six million years ago to modern humans, including brain
      size, jaw size, language, and manufacture of tools. SC.912.L.15.11:
      Discuss specific fossil hominids and what they show about human
      evolution.
