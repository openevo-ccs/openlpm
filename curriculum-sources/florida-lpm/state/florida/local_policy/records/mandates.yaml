  - id: FLLP-MANDATE-2026-draft-science-standards-evolution-omission
    slug: 2026-draft-science-standards-evolution-omission
    label: 2026 draft K-12 science standards omit the word "evolution" from high-school life-science content
    jurisdiction: US-FL
    issuingBody: Florida Department of Education (FLDOE)
    mandateType: state-policy-announcement
    statementText: >
      [Not a verbatim quotation of the draft standards themselves -- a
      reporting-level characterization, see accessTier/verificationStatus.]
      Per named reviewers at public-comment sessions, the word "evolution"
      does not appear anywhere in the proposed high-school life-science
      standards; specifically named missing vocabulary includes gene flow,
      genetic drift, origins of life, evidence of evolution, DNA
      transcription, and genetics. Middle-school standards reference natural
      selection without an explicit evolution framing. The terms "climate
      change" and "global warming" do not appear anywhere in the draft
      (which retains "weather and climate," "climate systems," and "climate
      impacts on biodiversity").
    adoptionDate: "2026-09-25"
    dateGranularity: day
    status: proposed
    sourceDocument: Draft 2026 Florida K-12 Science Standards (FLDOE standards-review process)
    sourceUrl: https://www.wusf.org/education/2026-09-30/evolution-climate-change-missing-from-floridas-new-k-12-science-standards
    accessTier: summary-only
    licenseOrRightsNote: >
      This record characterizes the draft's content via news reporting, not
      a verbatim quotation of the draft document itself (fldoe.org/standardsreview/
      returned HTTP 403 on automated fetch this session) -- summary-only is
      the honest tier here, not a rights restriction. Raise to excerpt-only/
      full-text-stored once the draft PDF itself is fetched and specific
      benchmark text can be quoted directly.
    verificationStatus: unverified-secondary-source
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        This is the single most important mandate record to upgrade in a
        follow-up session -- fetch fldoe.org/standardsreview/ or the draft
        PDF directly (a human browser session may be needed; automated fetch
        was blocked this session) and replace this reporting-level
        characterization with actual quoted benchmark text.
      sourceProvenance: >
        WUSF (Nancy Guan), "Evolution and climate change are missing from
        Florida's new K-12 science standards" (Sept 30, 2026); Florida
        Phoenix (Jay Waagmeester), Oct 14, 2026; NCSE (Glenn Branch), Oct 2
        and Oct 9, 2026 -- all fetched and read directly, but all are
        reporting ABOUT the draft, not the draft text itself.
