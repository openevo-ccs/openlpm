    jurisdiction: US-FL
    issuingBody: Florida State Board of Education
    mandateType: state-board-adopted-standard
    statementText: >
      Diversity and Evolution of Living Organisms
    adoptionDate: "2008-02-19"
    dateGranularity: day
    status: adopted
    sourceDocument: "Next Generation Sunshine State Standards (NGSSS), Science, standard SC.912.L.15 (document D1000338)"
    sourceUrl: https://api.commonstandardsproject.com/api/v1/standard_sets/80B94A122D3D4B95884660FF09CC357E_D1000338_grades-09-10-11-12
    accessTier: full-text-stored
    licenseOrRightsNote: >
      Same dual basis as FLLP-MANDATE-ngsss-2008-sc912l15-1 (Florida
