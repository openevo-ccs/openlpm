controversies:
  - id: FLLP-CONTROVERSY-2008-ngsss-evolution-wording-fight
    slug: 2008-ngsss-evolution-wording-fight
    label: The 2008 fight over explicitly naming evolution in the Next Generation Sunshine State Standards
    jurisdiction: US-FL
    controversyType: standards-adoption-fight
    topicArea: >
      Whether Florida's science standards should explicitly name "evolution"
      at all, and if so, whether the word must be qualified by "the
      scientific theory of."
    summary: >
      FLDOE's October 2007 draft standards were the first in Florida's history
      to explicitly use the word "evolution." Organized religious-right
      opposition (Focus on the Family, the Florida Baptist Witness, the
      Florida Family Policy Council, at least 12 county school boards)
      pushed back through late 2007, while Florida Citizens for Science led a
      public counter-campaign defending the draft, backed by the National
      Academy of Sciences and other scientific bodies. Days before the Feb
      19, 2008 vote, under pressure, the State Board had the draft redrafted
      to insert "the scientific theory of" before "evolution" as a last-minute
      compromise, which the Board then adopted 4-3.
    dateStart: "2007-10-19"
    dateEnd: "2008-02-19"
    status: resolved-compromise
    outcomeSummary: >
      The State Board adopted the standards with "the scientific theory of"
      qualifier inserted before "evolution" (and before several other
      scientific theories/laws) -- the first explicit naming of evolution in
      Florida's standards, but in a hedged form that satisfied neither side
      fully: opponents wanted evolution presented as contestable, while board
      member Roberto Martinez and the original writing committee considered
      the qualifier an unnecessary, "watered down" concession.
    outcomeDate: "2008-02-19"
    recurrenceOf: []
    crossRepoRefs:
      - "us-evolution-education-lpm:USLP-CONTROVERSY-american-evolution-education-culture-war"
    contestedObjects:
      - description: >
          Whether SC.912.L.15 and related benchmarks should name "evolution"
          explicitly, and whether that name should be qualified by "the
          scientific theory of."
        relatedMandateIds:
          - FLLP-MANDATE-ngsss-2008-sc912l15-1
          - FLLP-MANDATE-ngsss-2008-sc912l15-standard
        relatedEventIds:
          - FLLP-EVENT-fldoe-2007-draft-standards-released
          - FLLP-EVENT-county-school-board-resolutions-2007
          - FLLP-EVENT-ngsss-2008-state-board-vote
        relatedFindingIds:
          - FLLP-FINDING-evolution-naming-1996-to-2008-explicitness-shift
    positions:
      - actorId: FLLP-ACTOR-florida-citizens-for-science
        actorLabel: Florida Citizens for Science (Brandon Haught, co-founder)
        stance: supports-change
        stanceSummary: >
          Defended the original draft's unqualified use of "evolution,"
          organized a 1,700+-signature petition, and called the adopted
          compromise "a huge step forward for our Florida schools" despite
          the hedged wording.
        sourceUrl: https://ncse.ngo/evolution-comes-floridas-science-standards
        sourceDate: "2008-02-19"
        accessTier: excerpt-only
      - actorId: FLLP-ACTOR-florida-family-policy-council
        actorLabel: Florida Family Policy Council (John Stemberger)
        stance: opposes-change
        stanceSummary: >
          Organized opposition to the draft's explicit naming of evolution,
          part of the same push that led to the 2008 "Academic Freedom Act"
          legislative fight.
        sourceUrl: https://www.discovery.org/a/4510/
        sourceDate: "2008-01-01"
        accessTier: summary-only
      - actorLabel: Roberto Martinez (Florida State Board of Education member)
        stance: other
        stanceSummary: >
          Voted NO on the adopted compromise -- not because he opposed
          naming evolution, but because he considered the late "scientific
          theory of" qualifier an unnecessary watering-down of the original,
          scientifically stronger draft the National Academy of Sciences had
          endorsed: "What we have here is an effort by people to water down
          our standards."
        sourceUrl: https://ncse.ngo/evolution-comes-floridas-science-standards
        sourceDate: "2008-02-19"
        accessTier: excerpt-only
      - actorLabel: Donna Callaway (Florida State Board of Education member)
        stance: opposes-change
        stanceSummary: >
          Voted NO on the adopted compromise from the opposite direction,
          having pushed for a further "critical analysis" amendment to the
          evolution standard that did not pass.
        sourceUrl: https://ncse.ngo/evolution-comes-floridas-science-standards
        sourceDate: "2008-02-19"
        accessTier: summary-only
    mediaCoverage:
      - outlet: Education Week
        headline: "Fla. Panel's Evolution Vote Hailed"
        url: https://www.edweek.org/teaching-learning/fla-panels-evolution-vote-hailed/2008/02
        publicationDate: "2008-02-19"
        accessTier: citation-only
      - outlet: Science
        headline: "Florida Standards Support Evolution—With a Twist"
        url: https://www.science.org/doi/10.1126/science.319.5867.1168
        publicationDate: "2008-02-29"
        accessTier: citation-only
      - outlet: NBC News
        headline: "Florida adopts 'scientific theory of evolution'"
        url: https://www.nbcnews.com/news/amp/wbna23238493
        publicationDate: "2008-02-19"
        accessTier: citation-only
      - outlet: Answers in Genesis
        headline: "Florida Now Supports Teaching Evolution"
        url: https://answersingenesis.org/public-school/science-standards/florida-now-supports-teaching-evolution/
        publicationDate: "2008-02-23"
        framingNote: >
          Reactive commentary, not involvement in the Florida fight itself --
          expressed hope that "teachers will still end up treading quite
          carefully" despite the standards' adoption.
        accessTier: citation-only
    themes: ["evolution", "standards-adoption", "scientific-theory-wording"]
    exhaustivenessCaveat: >
      Built from NCSE's contemporaneous articles and the news sources they
      cite; the full set of 12+ county school-board resolutions was not
      individually verified (modeled as one combined timeline event).
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        NCSE, "Evolution Comes to Florida's Science Standards" and "The
        e-word arrives in Florida," both fetched and read directly.

  - id: FLLP-CONTROVERSY-2008-academic-freedom-act-legislative-fight
    slug: 2008-academic-freedom-act-legislative-fight
    label: The 2008 "Academic Freedom Act" (SB 2692/HB 1483) legislative fight
    jurisdiction: US-FL
    controversyType: legislative-mandate-fight
    topicArea: >
      Whether Florida law should require "critical analysis" of evolution be
      taught alongside it, via a Discovery-Institute-template "Academic
      Freedom Act."
    summary: >
      Running concurrently with the NGSSS standards fight, Sen. Ronda Storms
      and Rep. Alan Hays introduced companion bills modeled on Discovery
      Institute's template "Academic Freedom Act" legislation (the same
      template Louisiana enacted in June 2008 and Tennessee enacted in 2012).
      The House passed a substituted version 71-43, but the Senate rejected
      the substitution and the bill died in a standoff at the end of the
      2008 session.
    dateStart: "2008-01-01"
    dateEnd: "2008-05-02"
    status: resolved-outcome-rejected
    outcomeSummary: >
      The bill died without becoming law -- the House and Senate could not
      agree on which chamber's version to send to the Governor, and the
      session ended with no further action. Unlike the near-simultaneous
      NGSSS standards fight (which produced an adopted compromise), this
      legislative push produced no change to Florida law.
    outcomeDate: "2008-05-02"
    recurrenceOf: []
    contestedObjects:
      - description: >
          SB 2692 / HB 1483's proposed statutory language requiring "thorough
          presentation and critical analysis of the scientific theory of
          evolution" in Florida public schools.
        relatedEventIds:
          - FLLP-EVENT-sb2692-hb1483-2008-academic-freedom-act
          - FLLP-EVENT-hb837-2005-academic-freedom-bill-of-rights
    positions:
      - actorId: FLLP-ACTOR-discovery-institute
        actorLabel: Discovery Institute
        stance: supports-change
        stanceSummary: >
          Authored the model statute the Florida bills followed; a Discovery
          Institute representative appeared at a closed March 2008 press
          event for legislators hosted by Rep. Alan Hays.
        sourceUrl: https://www.discovery.org/a/4510/
        sourceDate: "2008-03-01"
        accessTier: excerpt-only
      - actorId: FLLP-ACTOR-florida-family-policy-council
        actorLabel: Florida Family Policy Council (John Stemberger)
        stance: supports-change
        stanceSummary: >
          Lead public advocate for the bill, citing anecdotal/unnamed claims
          of teachers facing reprisal for questioning evolution.
        sourceUrl: https://www.discovery.org/a/4510/
        sourceDate: "2008-03-01"
        accessTier: summary-only
      - actorId: FLLP-ACTOR-florida-citizens-for-science
        actorLabel: Florida Citizens for Science
        stance: opposes-change
        stanceSummary: >
          Publicized and opposed the bill through its own news releases,
          part of the same organizing effort defending the NGSSS draft.
        sourceUrl: https://www.flascience.org/wp/?p=529
        sourceDate: "2008-03-01"
        accessTier: summary-only
    mediaCoverage:
      - outlet: Discovery Institute (Evolution News)
        headline: "Prepared Remarks for Florida Academic Freedom Bill Press Conference"
        url: https://evolutionnews.org/2008/03/prepared_remarks_for_florida_a/
        publicationDate: "2008-03-01"
        framingNote: Advocacy-organization framing, supportive of the bill.
        accessTier: citation-only
      - outlet: Panda's Thumb
        headline: "Explore the str[ategy]..."
        url: https://pandasthumb.org/archives/2008/03/explore-the-str.html
        publicationDate: "2008-03-01"
        framingNote: NCSE-adjacent blog, critical framing.
        accessTier: citation-only
    themes: ["evolution", "academic-freedom-legislation", "legislative-fight"]
    exhaustivenessCaveat: >
      The exact House/Senate procedural standoff in late April 2008 (Tampa
      Tribune, April 29 2008) was not independently fetched this session --
      see source-notes confidence flag 5.
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
