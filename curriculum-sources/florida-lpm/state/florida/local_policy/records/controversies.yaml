  - id: FLLP-CONTROVERSY-2017-hb989-textbook-challenges
    slug: 2017-hb989-textbook-challenges
    label: 2017-2018 textbook challenges against evolution/climate content under HB 989
    jurisdiction: US-FL
    controversyType: textbook-or-materials-challenge
    topicArea: >
      Whether specific adopted science textbooks' treatment of evolution
      and/or human-caused climate change should be removed, stickered, or
      otherwise altered, using HB 989's any-resident-may-object mechanism.
    summary: >
      Within months of HB 989 taking effect, residents in at least three
      Florida counties (Nassau, Collier, Martin) filed formal objections
      specifically targeting evolution and/or climate-change content in
      adopted science textbooks. Nassau County's objection (the first
      statewide) sought disclaimer stickers; it and the Collier/Martin County
      objections were all rejected at the school-board level, but the
      mechanism itself remained in place for future use.
    dateStart: "2017-11-01"
    dateEnd: "2018-12-31"
    status: resolved-outcome-rejected
    outcomeSummary: >
      All three known 2017-18 evolution/climate-specific challenges failed
      at the school-board vote stage (Nassau's sticker proposal voted down;
      Collier and Martin both failed 3-2) -- the original textbooks were
      retained unaltered in every case. Florida Citizens for Science reports
      at least 7 total instructional-materials complaints statewide in HB
      989's first 5 months, of which at least 2 specifically targeted
      evolution/climate content.
    outcomeDate: "2018-12-31"
    recurrenceOf: []
    contestedObjects:
      - description: >
          Whether specific adopted biology/science textbooks' evolution and
          climate-change content should carry disclaimers or be removed from
          adoption, under HB 989's instructional-materials-objection process.
        relatedMandateIds:
          - FLLP-MANDATE-hb989-2017-instructional-materials
        relatedEventIds:
          - FLLP-EVENT-hb989-2017-signed-into-law
          - FLLP-EVENT-nassau-county-textbook-challenge-2017
          - FLLP-EVENT-collier-martin-county-textbook-challenges-2018
    positions:
      - actorLabel: Nassau County resident objector (name not captured in sources reviewed)
        stance: opposes-change
        stanceSummary: >
          Objected to evolution's "prominent place" in three textbooks,
          stating a goal "to stop the teaching of Darwinian evolution as
          fact," and requested disclaimer stickers.
        sourceUrl: https://www.flascience.org/?p=2997
        sourceDate: "2017-11-01"
        accessTier: excerpt-only
      - actorId: FLLP-ACTOR-florida-citizens-for-science
        actorLabel: Florida Citizens for Science
        stance: supports-status-quo
        stanceSummary: >
          Tracked and publicized each challenge, supporting the textbooks as
          adopted and opposing the stickering/removal requests.
        sourceUrl: https://www.flascience.org/?p=3506
        sourceDate: "2018-01-01"
        accessTier: summary-only
    mediaCoverage:
      - outlet: The World (PRX)
        headline: "Florida allows any resident to challenge textbooks — and it has some science supporters concerned"
        url: https://theworld.org/stories/2017/09/10/florida-allows-any-resident-challenge-textbooks-and-it-has-some-science
        publicationDate: "2017-09-10"
        accessTier: citation-only
    themes: ["evolution", "climate-change", "textbook-challenge", "instructional-materials-law"]
    exhaustivenessCaveat: >
      Covers the specific episodes named in sources reviewed (Nassau,
      Collier, Martin counties); FCS's own count of 7+ total statewide
      complaints in the first 5 months suggests other, non-evolution-specific
      challenges this record does not individually enumerate.
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        Florida Citizens for Science's own reporting (flascience.org/?p=2997,
        /?p=3506) and The World/PRX (Sept 10 2017) -- all fetched and read
        directly.

  - id: FLLP-CONTROVERSY-2026-proposed-standards-evolution-climate-omission
    slug: 2026-proposed-standards-evolution-climate-omission
    label: The 2026 fight over omitting "evolution" and "climate change" from Florida's first science-standards rewrite since 2008
    jurisdiction: US-FL
    controversyType: standards-adoption-fight
    topicArea: >
      Whether Florida's proposed 2026 K-12 science standards -- which do not
      use the word "evolution" in high-school life-science content, and do
      not use "climate change"/"global warming" anywhere -- should be revised
      before adoption, and what the omissions mean about the state's intent.
    summary: >
      FLDOE's draft rewrite (the first full science-standards revision since
      2008) removes explicit naming of both evolution and climate change,
      drawing fierce, wide-ranging criticism from teachers, a science
      specialist, the state teachers' union, and the National Center for
      Science Education, while FLDOE's own leadership defends the draft as
      still substantively covering the underlying science. As of this
      record's provenance date, the dispute is active: a public-comment
      listening tour is underway and a State Board vote is expected December
      2026.
    dateStart: "2026-09-25"
    status: active
    recurrenceOf: [FLLP-CONTROVERSY-2008-ngsss-evolution-wording-fight]
    crossRepoRefs:
      - "us-evolution-education-lpm:USLP-CONTROVERSY-american-evolution-education-culture-war"
    contestedObjects:
      - description: >
          Whether the 2026 draft's omission of the word "evolution" from
          high-school life-science standards, and of "climate change"/"global
          warming" from the entire document, should be corrected before the
          State Board's expected December 2026 vote.
        relatedMandateIds:
          - FLLP-MANDATE-2026-draft-science-standards-evolution-omission
          - FLLP-MANDATE-ngsss-2008-sc912l15-standard
        relatedEventIds:
          - FLLP-EVENT-2026-standards-review-process-begins
          - FLLP-EVENT-2026-draft-standards-released-for-comment
          - FLLP-EVENT-2026-listening-tour-armwood-hs
          - FLLP-EVENT-2026-virtual-statewide-listening-session
          - FLLP-EVENT-2026-orange-county-listening-session
          - FLLP-EVENT-2026-state-board-vote-expected
          - FLLP-EVENT-2024-textbook-climate-content-removal
        relatedFindingIds:
          - FLLP-FINDING-2026-draft-omits-evolution-and-climate-explicit-naming
    positions:
      - actorId: FLLP-ACTOR-fldoe
        actorLabel: Henry Mack (Florida Education Commissioner)
        stance: supports-status-quo
        stanceSummary: >
          Defended the draft as substantively covering evolution and climate
          science despite the wording concerns: "We want evolutionary biology
          in the standards, they are in the standards... My kids are reading
          Charles Darwin"; "We are teaching climate science... Sea level rise
          is in the standards." Separately described the draft's philosophy
          in explicitly classical/teleological terms: "Science begins in
          wonder, not in ideology... Florida's new standards will form
          students who observe carefully, reason rigorously, and treat the
          natural world as something given to be known, not invented."
        sourceUrl: https://www.wusf.org/education/2026-09-30/evolution-climate-change-missing-from-floridas-new-k-12-science-standards
        sourceDate: "2026-09-30"
        accessTier: excerpt-only
      - actorLabel: Patricia Duncan (FLDOE Senior Education Manager)
        stance: neutral-fact-finding
        stanceSummary: >
          Told a public listening session the omissions were "not
          intentional," and that the listening tour was "the first of many
          steps."
        sourceUrl: https://floridaphoenix.com/2026/10/14/new-k-12-science-curriculum-scrutinized-december-vote-by-board-of-ed-expected
        sourceDate: "2026-09-30"
        accessTier: excerpt-only
      - actorId: FLLP-ACTOR-ncse
        actorLabel: Glenn Branch (NCSE Deputy Director)
        stance: opposes-change
        stanceSummary: >
          "I would like to say something nice about the new standards, but
          I can't." Criticized the draft's ~1,000 high-school benchmarks as
          "a mile wide and an inch deep," much of it "fun-fact-style
          trivia" rather than a teaching framework.
        sourceUrl: https://ncse.ngo/proposed-new-florida-science-standards-attract-fierce-criticism
        sourceDate: "2026-10-02"
        accessTier: excerpt-only
      - actorId: FLLP-ACTOR-teacher-institute-for-evolutionary-science
        actorLabel: Bertha Vazquez (Director, Teacher Institute for Evolutionary Science)
        stance: opposes-change
        stanceSummary: >
          "Moving backward... If it's not broken, why the hell are we fixing
          it? We had smash bang good standards."
        sourceUrl: https://www.wusf.org/education/2026-09-30/evolution-climate-change-missing-from-floridas-new-k-12-science-standards
        sourceDate: "2026-09-30"
        accessTier: excerpt-only
      - actorLabel: Robin Williams (retired biology/environmental-science teacher)
        stance: opposes-change
        stanceSummary: >
          "Evolution is a fundamental underlying process unifying all of
          biology. To leave it out is ideology posing as biology."
        sourceUrl: https://www.wusf.org/education/2026-09-30/evolution-climate-change-missing-from-floridas-new-k-12-science-standards
        sourceDate: "2026-09-30"
        accessTier: excerpt-only
      - actorLabel: Lindsey Craven (Science Specialist, grades 9-12, Pinellas County Schools)
        stance: opposes-change
        stanceSummary: >
          Noted the standards "reference... evolution without actually...
          stating evolution."
        sourceUrl: https://www.wusf.org/education/2026-09-30/evolution-climate-change-missing-from-floridas-new-k-12-science-standards
        sourceDate: "2026-09-30"
        accessTier: excerpt-only
      - actorId: FLLP-ACTOR-florida-education-association
        actorLabel: Florida Education Association
        stance: opposes-change
        stanceSummary: >
          Warned that teaching outside mainstream science leaves Florida
          students "at a disadvantage," and formally requested extended
          review periods and additional virtual town halls.
        sourceUrl: https://floridaphoenix.com/2026/10/14/new-k-12-science-curriculum-scrutinized-december-vote-by-board-of-ed-expected
        sourceDate: "2026-10-14"
        accessTier: excerpt-only
    mediaCoverage:
      - outlet: WUSF Public Media
        headline: "Evolution and climate change are missing from Florida's new K-12 science standards"
        url: https://www.wusf.org/education/2026-09-30/evolution-climate-change-missing-from-floridas-new-k-12-science-standards
        publicationDate: "2026-09-30"
        accessTier: citation-only
      - outlet: Florida Phoenix
        headline: "New K-12 science curriculum scrutinized; December vote by Board of Ed expected"
        url: https://floridaphoenix.com/2026/10/14/new-k-12-science-curriculum-scrutinized-december-vote-by-board-of-ed-expected
        publicationDate: "2026-10-14"
        framingNote: Also mirrored at Florida Trend and Yahoo News per this repo's research.
        accessTier: citation-only
      - outlet: National Center for Science Education (NCSE)
        headline: "Proposed new Florida science standards attract fierce criticism"
        url: https://ncse.ngo/proposed-new-florida-science-standards-attract-fierce-criticism
        publicationDate: "2026-10-02"
        framingNote: Advocacy-organization framing, critical of the draft.
        accessTier: citation-only
      - outlet: National Center for Science Education (NCSE)
        headline: "Florida Opens Pandora's Box of Educational Horrors with Proposed New Science Standards"
        url: https://ncse.ngo/florida-opens-pandoras-box-educational-horrors-proposed-new-science-standards
        publicationDate: "2026-10-09"
        framingNote: >
          The article that prompted this repo's founding; itself mostly
          links out to NCSE's own prior reporting and to Pat Beall's Fort
          Lauderdale Sun Sentinel column (Oct 9 2026, not independently
          fetched -- likely paywalled).
        accessTier: citation-only
    themes: ["evolution", "climate-change", "standards-adoption", "naming-explicitness", "recurring-fault-line"]
    exhaustivenessCaveat: >
      This record reflects news coverage of the draft and of public-comment
      sessions, not a direct read of the draft standards document itself
      (fldoe.org/standardsreview/ returned HTTP 403 on automated fetch this
      session). Florida Citizens for Science's own 2026 position could not be
      found despite being the historically central Florida-specific voice on
      this issue -- a real gap, not an indication the organization has no
      position. This controversy is ACTIVE and unresolved as of this
      record's provenance date; update status/outcomeSummary/outcomeDate
      once the State Board actually votes.
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        WUSF (Nancy Guan, Sept 30 2026), Florida Phoenix (Jay Waagmeester,
        Oct 14 2026), NCSE (Glenn Branch, Oct 2 and Oct 9 2026) -- all
        fetched and read directly, the three sources listed in
        docs/source-notes/ as independently verified rather than
