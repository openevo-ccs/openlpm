    jurisdiction: US-FL
    standardOrAttribute: NGSSS/B.E.S.T. (pending 2026 readoption) SC.912.L.15 (Diversity and Evolution of Living Organisms)
    gradeRange: "9-12"
    sourceSystem: openevo-conceptbase-competencybase-informal-refs
    sourceRepoPath: ../../../../bio-core-k12/strands/strand-102-natural-selection-adaptation.yaml
    coverageStatus: canonical-items-concept-tagged
    notes: >
      Informal reference only (plain path, not a validated cross-repo link,
