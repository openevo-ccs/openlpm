  - id: FLLP-PRINCIPLE-standards-committees-need-proportionate-disciplinary-expertise
    slug: standards-committees-need-proportionate-disciplinary-expertise
    label: A standards-writing committee needs disciplinary experts proportionate to what it is writing standards for
    domain: computational-curriculum-studies
    jurisdictionScope: US-FL
    statement: >
      A committee asked to write K-12 science standards should include
      enough working scientists and science educators that the document's
      scientific framing is actually load-bearing in the room, not a single
      voice outnumbered seventeen to one. Florida's 2026 draft was written
      by an 18-person committee with exactly one science-education
      professional on it -- the rest school-district employees -- at the
      same time FLDOE reportedly has no K-12 science specialists on its own
      staff. This is a staffing-composition fact, independent of what the
      resulting standards actually say, and it is a predictable risk factor
      for exactly the kind of gap (a 1,000-benchmark document a national
      science-education organization calls "a mile wide and an inch deep")
      that followed.
    rationale: >
      This principle deliberately stops short of asserting the committee
      composition CAUSED the specific omissions reported in the 2026 draft
      -- that causal claim isn't something this repo's research established,
      and asserting it would overstate what's actually known. What IS
      established is the staffing fact itself, confirmed by FLDOE's own
      named officials (Patricia Duncan, Alicia Foy). A review process this
      thin on subject-matter expertise is a structural risk condition worth
      naming on its own terms.
    groundedIn:
      - FLLP-EVENT-2026-standards-review-process-begins
      - FLLP-CONTROVERSY-2026-proposed-standards-evolution-climate-omission
