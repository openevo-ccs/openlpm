principles:
  - id: FLLP-PRINCIPLE-explicit-naming-outlasts-euphemism
    slug: explicit-naming-outlasts-euphemism
    label: Standards that name a contested concept explicitly are more durable than standards that gesture at it euphemistically
    domain: computational-curriculum-studies
    jurisdictionScope: US-FL
    statement: >
      When a curriculum standard avoids naming a scientifically settled but
      politically contested concept directly -- using a vaguer substitute
      phrase instead of the term itself -- that avoidance does not resolve
      the underlying political pressure; it just defers the fight to the
      next revision cycle, at a cost paid by whichever cohort of students
      sits between editions. Florida's own record is the clearest evidence
      for this available anywhere in this ecosystem: standards that avoided
      "evolution" (pre-2008) were graded academically unsound by name; the
      standards that then explicitly named it, even in hedged form, held for
      eighteen years; and the current proposal to drop explicit naming again
      is being criticized in the same terms the 2005 Fordham review used
      against the pre-2008 standards. A standards body gains nothing durable
      by euphemism -- only a shorter interval before the same argument
      recurs.
    rationale: >
      This is not a claim that explicit naming settles the underlying
      political disagreement -- it doesn't, and Florida's 2008 compromise
      ("the scientific theory of evolution") shows a state can name a
      concept explicitly while still hedging around it. The claim is
      narrower and empirical: avoidance is not even a stable truce. It is
      simply the shortest-lived of the three postures a standards document
      can take (avoid, hedge, name plainly), based on the one case this
      ecosystem has tracked across four decades.
    groundedIn:
      - FLLP-FINDING-evolution-naming-1996-to-2008-explicitness-shift
      - FLLP-FINDING-2026-draft-omits-evolution-and-climate-explicit-naming
      - FLLP-CONTROVERSY-2008-ngsss-evolution-wording-fight
      - FLLP-CONTROVERSY-2026-proposed-standards-evolution-climate-omission
      - FLLP-MANDATE-ngsss-2008-sc912l15-standard
