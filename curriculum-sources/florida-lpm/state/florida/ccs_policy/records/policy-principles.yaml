  - id: FLLP-PRINCIPLE-documented-controversy-is-teachable-nature-of-science-content
    slug: documented-controversy-is-teachable-nature-of-science-content
    label: A well-documented, decades-long curriculum controversy is itself legitimate classroom content, not just background politics to route around
    domain: interdisciplinary-curriculum-design
    jurisdictionScope: US-FL
    statement: >
      Florida's own evolution-standards history -- a real, four-decade,
      multiply-recurring public fight over what a state is willing to name
      in its own science standards -- is a concrete, well-sourced case study
      in how scientific consensus, institutional governance, and organized
      public pressure actually interact. Rather than treating this history
      as noise to be kept out of the classroom, a curriculum designed around
      OpenEvo's Nature of Science and civic-reasoning goals can use Florida's
      own documented record (who took which position, what changed, what
      didn't) as a worked example of how a real governing body resolves --
      or fails to resolve -- a contested empirical question under public
      pressure, distinct from and in addition to teaching the underlying
      biology itself.
    rationale: >
      This is the practical payoff of building policy-controversy-record in
      the first place: once a controversy is modeled as a structured record
      (named positions, real press coverage, a tracked outcome) rather than
      left as prose, it becomes something a curriculum designer can actually
      build a lesson or discussion unit from, not just background context a
      teacher has to research independently.
    groundedIn:
      - FLLP-CONTROVERSY-2008-ngsss-evolution-wording-fight
      - FLLP-CONTROVERSY-2017-hb989-textbook-challenges
      - FLLP-CONTROVERSY-2026-proposed-standards-evolution-climate-omission
