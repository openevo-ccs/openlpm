  - id: TNLP-PRINCIPLE-the-scopes-trial-is-itself-teachable-history-of-science-content
    slug: the-scopes-trial-is-itself-teachable-history-of-science-content
    label: The Scopes Trial is a real, concrete case study in how scientific consensus and public institutions actually interact under pressure
    domain: interdisciplinary-curriculum-design
    jurisdictionScope: US-TN
    statement: >
      A hundred years on, Tennessee's own Scopes Trial -- an engineered test
      case, a media circus, a courtroom cross-examination of a public
      figure's own literalist beliefs, and a conviction reversed on a
      technicality rather than a verdict on the science -- is exactly the
      kind of worked example OpenEvo's Nature of Science and civic-reasoning
      goals can draw on directly: how a legal system, a press corps, and a
      scientific community actually responded to a real controversy, not a
      hypothetical one. The repeated recurrence of the same underlying
      question in 1973 and 2012 extends the lesson: this is not a closed,
      one-time historical event but a documented, recurring pattern a
      student can trace across a full century using this repo's own
      recurrenceOf chain.
    rationale: >
      Same underlying payoff florida-lpm's own equivalent principle names:
      once a controversy is modeled as a structured record rather than left
      as prose, it becomes something a curriculum designer can build a
      lesson or unit from directly. Tennessee's century-long chain is the
      single richest version of this payoff in this ecosystem so far.
    groundedIn:
      - TNLP-CONTROVERSY-butler-act-and-scopes-trial
      - TNLP-CONTROVERSY-tn-1973-equal-time-law
      - TNLP-CONTROVERSY-tn-2012-teacher-protection-act
