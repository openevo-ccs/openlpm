principles:
  - id: TNLP-PRINCIPLE-softened-language-is-a-tactic-not-a-change-of-goal
    slug: softened-language-is-a-tactic-not-a-change-of-goal
    label: When a recurring legislative fight loses in court, the next round tends to arrive in secularized language, not a changed goal
    domain: computational-curriculum-studies
    jurisdictionScope: US-TN
    statement: >
      Tennessee's own hundred-year record shows the same underlying question
      -- should a biblical account of human origins get special legal
      protection in the science classroom -- pursued through three
      legislatively distinct mechanisms, each one measurably more
      secular-sounding than the last: an outright criminal prohibition
      (1925), a mandate to teach Genesis with "equal emphasis" (1973,
      struck down specifically for naming the Bible), and a law protecting
      "scientific strengths and weaknesses" that never names religion at
      all (2012, still standing). A curriculum-policy archive that only
      reads each era's law on its own terms, without comparing it to what
      came before, would miss that the softening itself is the pattern --
      and would risk taking 2012's secular framing at face value rather
      than reading it as a direct, legible response to why 1973 lost in
      court.
    rationale: >
      This is an inference this repo's own research drew from comparing
      three real statutes' text side by side (see
      TNLP-FINDING-1973-law-vs-2012-law-framing-shift) -- not a claim any
      named 2012 legislator stated outright the way Rep. Bill Carter
      explicitly did for the 1973 bill. The principle is offered as a
      documented pattern worth watching for in any other jurisdiction's own
      recurring legislative fight, not as a settled fact about anyone's
      stated intent in 2012.
    groundedIn:
      - TNLP-FINDING-butler-act-vs-1973-law-strategy-shift
      - TNLP-FINDING-1973-law-vs-2012-law-framing-shift
      - TNLP-CONTROVERSY-tn-2012-teacher-protection-act
    designPrinciples: []
    contentAnchors: ["Our Mind"]
    conceptRefs: []
