      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0

  - id: TNLP-PRINCIPLE-an-unenforced-or-untested-law-is-still-a-real-mandate
    slug: an-unenforced-or-untested-law-is-still-a-real-mandate
    label: A law nobody has prosecuted under, or ever invoked, is still a real curriculum mandate worth documenting precisely
    domain: computational-curriculum-studies
    jurisdictionScope: US-TN
    statement: >
      The Butler Act itself was enforced exactly once (Scopes) in its
      42-year life, by its own governor's admission expected never to be
      used at all. The 2012 Teacher Protection Act, per this repo's own
      research, has apparently never been invoked in a documented case
      either. Neither fact makes either law less real as a legal
      requirement teachers and districts must account for -- a curriculum-
      policy archive's job is to document what a jurisdiction's law actually
      says and requires, independent of how often, or whether, it has ever
      been tested in practice.
    rationale: >
      Worth stating explicitly because it would be easy to under-document a
      law that "doesn't seem to matter" in daily practice. Tennessee's own
      history argues the opposite: an unenforced law can still produce a
      landmark national trial decades after its passage (nobody enforcing
      the Butler Act in 1925 predicted Scopes), and a currently-untested law
      can still be cited by this exact kind of archive as live, binding, and
      worth tracking for exactly that reason.
    groundedIn:
      - TNLP-MANDATE-butler-act-1925
      - TNLP-MANDATE-tn-2012-teacher-protection-act
      - TNLP-CONTROVERSY-tn-2012-teacher-protection-act
