crosswalks:
  - id: TNLP-CROSSWALK-tn2022-common-standards-project-api
    slug: tn2022-common-standards-project-api
    label: "Tennessee Academic Standards for Science (2022), Biology I/Grade 8 evolution strands -- live source: Common Standards Project API"
    jurisdiction: US-TN
    standardOrAttribute: "Tennessee Academic Standards for Science (2022) -- BIO1.LS3 (Heredity), BIO1.LS4 (Biological Change: Unity and Diversity), 8.LS4 (Biological Change: Unity and Diversity)"
    gradeRange: "8-12"
    sourceSystem: common-standards-project-api
    coverageStatus: canonical-items-concept-tagged
    notes: >
      CONFIRMED LIVE 2026-10-20, independently twice (a delegated research
      agent and the main session's own direct curl calls). GET
      https://api.commonstandardsproject.com/api/v1/jurisdictions/180878796A3C448D808F38BCCCFD26CF
      lists Tennessee's standard sets (480 total, three generations of
      science standards: 2009-2016 deprecated, 2016 superseded-in-practice,
      2022 current); GET
      https://api.commonstandardsproject.com/api/v1/standard_sets/E068CD122CE146DFBCED7A17EE6E130A
      (Biology I) and .../D19049B7586D4FD2B5E1CE17D2694B94 (grade 8) return
      the real, current evolution/heredity benchmark clusters. A THIRD
      distinct licensing case among this ecosystem's three state repos so
      far: CC BY 4.0 US, rightsHolder "Common Curriculum, Inc." -- different
      from both Florida's CC BY 3.0 US and Pennsylvania's no-license-stated
      data.
    licenseOrRightsNote: >
      Independently and openly licensed by the Common Standards Project's
      compiler: CC BY 4.0 US (http://creativecommons.org/licenses/by/4.0/us/),
      rightsHolder "Common Curriculum, Inc." Tennessee's own government text
      is additionally a public record; see
      state/tennessee/local_policy/records/mandates.yaml for the specific
      statutory-text legal basis used for this repo's older (1925/1973/2012)
      mandate records.
    verificationStatus: verified
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        api.commonstandardsproject.com, fetched directly and read in full
        2026-10-20 (both by a delegated research agent and independently by
        the main session).

