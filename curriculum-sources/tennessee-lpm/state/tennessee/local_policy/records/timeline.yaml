  - id: TNLP-EVENT-scopes-trial
    slug: scopes-trial
    label: The Scopes Trial -- Darrow, Bryan, and a guilty verdict
    jurisdiction: US-TN
    eventType: other
    dateStart: "1925-07-10"
    dateEnd: "1925-07-21"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Rhea County Courthouse, Dayton, Tennessee. Judge John T. Raulston.
      Prosecution: District Attorney Tom Stewart, Herbert E. Hicks, Sue K.
      Hicks, Gordon McKenzie, joined by William Jennings Bryan. Defense:
      Clarence Darrow (lead), Arthur Garfield Hays (ACLU), Dudley Field
      Malone, John R. Neal, W.O. Thompson, F.B. McElwee. On day 7, with the
      jury excused, Darrow called Bryan to the stand to question his literal
      reading of the Bible -- asked where Cain found his wife, Bryan replied
      he'd "leave the agnostics to hunt for her," an exchange generally
      treated as having damaged Bryan's credibility even though Raulston
      struck the testimony the next day. Scopes was found guilty and fined
      $100 (set by the judge, not the jury -- the basis of the 1927
      reversal). H.L. Mencken's Baltimore Sun coverage coined "Monkey
      Trial"; this was the first American trial broadcast live nationally
      by radio (Chicago's WGN).
    involvedActors: [TNLP-ACTOR-aclu]
    sourceUrl: https://en.wikipedia.org/wiki/Scopes_trial
    accessTier: excerpt-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        Wikipedia, "Scopes trial"; Science History Institute -- both fetched
        and read directly.

  - id: TNLP-EVENT-bryan-death
    slug: bryan-death
    label: William Jennings Bryan dies in Dayton, five days after the trial
    jurisdiction: US-TN
    eventType: other
    dateStart: "1925-07-26"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Bryan died in his sleep (reported stroke) in Dayton, Tennessee, after
      church and an afternoon nap. H.L. Mencken privately remarked "We
      killed the son-of-a-bitch!" and his published obituary (Baltimore
      Evening Sun, July 27) was openly hostile, calling Bryan "a vulgar and
      common man."
    involvedActors: []
    sourceUrl: https://en.wikipedia.org/wiki/William_Jennings_Bryan
    accessTier: excerpt-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
