        Obituary for Bryan" -- both fetched and read directly.

  - id: TNLP-EVENT-scopes-appeal-ruling
    slug: scopes-appeal-ruling
    label: Tennessee Supreme Court upholds the Butler Act but reverses Scopes's conviction on a technicality
    jurisdiction: US-TN
    eventType: court-ruling
    dateStart: "1927-01-15"
    dateGranularity: month
    temporalStatus: past-completed
    description: >
      Scopes v. State, 289 S.W. 363, 154 Tenn. 105 (Tenn. 1927). A 3-1
      decision, Chief Justice Grafton Green writing: the Butler Act was held
      constitutional, but Scopes's conviction was reversed because Tennessee
      law required fines over $50 be set by a jury, not a judge -- the
      judge-imposed $100 fine was improper. The court wrote "nothing is to
      be gained by prolonging the life of this bizarre case" and recommended
      the state enter a nolle prosequi rather than retry Scopes, "to
      preserve the peace and dignity of the state" -- deliberately ending
      the prosecution without striking the law itself. The state did not
      retry Scopes.
    involvedActors: []
    sourceUrl: https://time.com/archive/6777617/education-bizarre/
    accessTier: excerpt-only
    licenseOrRightsNote: A state appellate court's own published opinion is a public judicial record.
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        Exact day of the ruling is disputed across secondary sources
        (January 14 vs. 17, 1927) -- dateStart recorded at month granularity
        pending confirmation of the exact day against a primary court
        record.
      sourceProvenance: >
        TIME archive, "Education: Bizarre"; Americans United, "Scopes
        forever" -- both fetched and read directly.

  - id: TNLP-EVENT-gary-scott-fired
    slug: gary-scott-fired
    label: Gary Scott fired for teaching evolution, triggering the Butler Act's repeal
    jurisdiction: US-TN
    eventType: other
    dateStart: "1967-04-13"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Gary L. Scott, a science teacher in Jacksboro, Tennessee, was fired
      for teaching evolution -- unlike Scopes, not a staged test case; Scott
      said he didn't realize he'd broken the law. He sued for reinstatement
      on First Amendment grounds, represented by William Kunstler (later the
      Chicago Seven's attorney) with ACLU support.
    involvedActors: [TNLP-ACTOR-aclu]
    sourceUrl: https://www.knoxtntoday.com/his-name-was-gary-scott-and-he-is-a-hero/
    accessTier: summary-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: Knox TN Today, "His name was Gary Scott, and he is a hero," fetched and read directly.

  - id: TNLP-EVENT-butler-act-repealed
    slug: butler-act-repealed
    label: Tennessee repeals the Butler Act within days of Scott's lawsuit
    jurisdiction: US-TN
    eventType: legislation
    dateStart: "1967-05-13"
    dateEnd: "1967-05-18"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Within three days of Gary Scott's lawsuit being filed, a repeal bill
      (House Bill No. 48, Chapter No. 237) passed both chambers of the
      Tennessee legislature on May 13, 1967. Governor Buford Ellington
      signed it (exact day disputed between May 17 and 18 across sources).
      Effective September 1, 1967 -- roughly 18 months before the US Supreme
      Court's Epperson v. Arkansas (decided Nov 12, 1968) struck down a
      near-identical Arkansas law; Tennessee's repeal was driven
      independently by the Scott controversy, not a response to Epperson.
    involvedActors: [TNLP-ACTOR-tennessee-general-assembly]
    sourceUrl: https://en.wikipedia.org/wiki/Butler_Act
    accessTier: excerpt-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        Exact signing day (May 17 vs. 18, 1967) disputed across secondary
        sources; May 18 is better supported.
      sourceProvenance: >
        Wikipedia, "Butler Act"; Scientific American, "50 Years Ago: Repeal
        of Tennessee's Monkey Law" -- both fetched and read directly.

  - id: TNLP-EVENT-epperson-v-arkansas
    slug: epperson-v-arkansas
    label: US Supreme Court strikes down Arkansas's near-identical anti-evolution law
    jurisdiction: US
    eventType: court-ruling
    dateStart: "1968-11-12"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Epperson v. Arkansas, 393 U.S. 97 (1968) -- not a Tennessee case, but
      directly relevant context: the US Supreme Court struck down Arkansas's
      own Butler-Act-style anti-evolution law as an unconstitutional
      establishment of religion. Tennessee had already repealed its own
      Butler Act roughly 18 months earlier, independently of this ruling
      (see TNLP-EVENT-butler-act-repealed) -- included here to make that
      timing relationship explicit and checkable rather than assumed.
    involvedActors: []
    sourceUrl: https://en.wikipedia.org/wiki/Butler_Act
    accessTier: summary-only
    licenseOrRightsNote: A US Supreme Court ruling is a public judicial record.
    verificationStatus: unverified-secondary-source
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        This record exists to document the TIMING relationship with
        Tennessee's own 1967 repeal, not as a primary finding about Arkansas
        law -- the case itself was not independently re-verified beyond
        what the Butler Act research already corroborated.
      sourceProvenance: >
        Referenced via Wikipedia's "Butler Act" article and Scientific
        American's retrospective, both fetched directly in service of the
        Tennessee repeal research.

  - id: TNLP-EVENT-russell-artist-advocacy
    slug: russell-artist-advocacy
