$schema: ../../../../schema/policy-timeline-event.schema.json
$description: >
  Dated events in Tennessee's evolution-education policy history, spanning
  a full century: the 1925 Butler Act and Scopes Trial, the 1967 repeal, the
  1973 "equal time" law struck down in 1975, the 2012 Teacher Protection
  Act, and the 2022 state standards revision. See
  docs/source-notes/2026-10-20-tennessee-evolution-curriculum-policy-history-research.md.

events:
  - id: TNLP-EVENT-butler-act-introduced
    slug: butler-act-introduced
    label: Rep. John Washington Butler introduces House Bill No. 185
    jurisdiction: US-TN
    eventType: legislation
    dateStart: "1925-01-21"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Rep. John Washington Butler introduced House Bill No. 185, making it
      unlawful for any teacher in a state-funded Tennessee school or
      university to teach "any theory that denies the story of the Divine
      Creation of man as taught in the Bible" in favor of descent "from a
      lower order of animals," with a misdemeanor penalty of $100-$500 per
      offense.
    involvedActors: [TNLP-ACTOR-tennessee-general-assembly]
    sourceUrl: https://en.wikipedia.org/wiki/Butler_Act
    accessTier: excerpt-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: Wikipedia, "Butler Act," cross-checked against the full statutory text hosted at todayinsci.com.

