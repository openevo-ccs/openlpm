  - id: TNLP-EVENT-tn-1973-equal-time-law-passed
    slug: tn-1973-equal-time-law-passed
    label: Tennessee passes the 1973 "equal time" / "Genesis Bill"
    jurisdiction: US-TN
    eventType: legislation
    dateStart: "1973-04-18"
    dateEnd: "1973-04-30"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Senate Bill 394 / House Bill 597, enacted as Chapter 377 of the 1973
      Public Acts. Sponsored by Sen. Milton H. Hamilton with House backing
      from Speaker Ned McWherter and Rep. Tommy Bennett; championed by Rep.
      Bill Carter of Rhea County (home of the original Scopes trial), who
      said: "Since I unsuccessfully opposed the repeal of the 'Evolution
      Law'... I have been duty bound to do all I can to see that this bill
      is passed." Required biology textbooks discussing "origins or
      creation of man" to give "commensurate attention to, and an equal
      amount of emphasis on" other theories "including, but not limited to,
      the Genesis account in the Bible," and required evolution be
      presented as "not represented to be scientific fact" -- a disclaimer
      not applied to the Bible, which the statute defined as a "reference
      work." Signed by Governor Winfield Dunn.
    involvedActors: [TNLP-ACTOR-tennessee-general-assembly]
    sourceUrl: https://jsreligion.org/issues/vol16/edwards.html
    accessTier: excerpt-only
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        Journal of Southern Religion, "'Equal Space With Adam and Eve':
        Tennessee's 'Genesis Bill' of 1973," fetched and read directly.

  - id: TNLP-EVENT-daniel-v-waters
    slug: daniel-v-waters
    label: Daniel v. Waters -- federal courts strike down the 1973 law
    jurisdiction: US
    eventType: court-ruling
    dateStart: "1974-02-26"
    dateEnd: "1975-04-10"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Tennessee biology teachers and parents, joined by the National
      Association of Biology Teachers, sued the state textbook board. The
      federal district court (M.D. Tenn.) initially abstained on the merits
      (Feb 26, 1974); on remand it found the law gave "a clearly defined
      preferential position for the Biblical version of creation" (399 F.
      Supp. 510). The Sixth Circuit Court of Appeals affirmed, 515 F.2d 485
      (6th Cir. 1975), decided April 10, 1975 -- Judge George Edwards wrote
      the majority opinion calling the law "patently unconstitutional" on
      two grounds: its special treatment of "occult or satanical beliefs,"
      and its special treatment of the Genesis account specifically. Not
      appealed further.
    involvedActors:
      - TNLP-ACTOR-tennessee-general-assembly
      - TNLP-ACTOR-national-association-of-biology-teachers
    sourceUrl: https://en.wikipedia.org/wiki/Daniel_v._Waters
    accessTier: excerpt-only
    licenseOrRightsNote: Federal court opinions are public judicial records.
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      sourceProvenance: >
        Wikipedia, "Daniel v. Waters"; TalkOrigins case summary -- both
        fetched and read directly.

