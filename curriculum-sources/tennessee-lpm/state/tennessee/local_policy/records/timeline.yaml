  - id: TNLP-EVENT-tn-court-of-appeals-lexisnexis-ruling
    slug: tn-court-of-appeals-lexisnexis-ruling
    label: Tennessee Court of Appeals rules LexisNexis is not a state actor
    jurisdiction: US-TN
    eventType: court-ruling
    dateStart: "2023-11-09"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Public.Resource.Org v. Matthew Bender & Company, M2022-01260-COA-R3-CV.
      The Tennessee Court of Appeals ruled LexisNexis is a private
      contractor, not a state actor, and is not bound by Tennessee's
      public-records law on this basis -- affirming (with modification) that
      the Tennessee Code Annotated is exempt from disclosure since state law
      provides a separate dedicated channel for publishing it (the
      LexisNexis contract itself). Net effect: Tennessee does not formally
      claim copyright over its own statutory text, but the complete official
      annotated code remains gated behind a commercial product, with the
      courts upholding that arrangement.
    involvedActors: [TNLP-ACTOR-public-resource-org]
    sourceUrl: https://law.justia.com/cases/tennessee/court-of-appeals/2023/m2022-01260-coa-r3-cv.html
    accessTier: excerpt-only
    licenseOrRightsNote: A state appellate court's own published opinion is a public judicial record.
    verificationStatus: primary-source-confirmed
    provenance:
      extracted_by: llm
      added_by: dustin.eirdosh@eva.mpg.de
      date: "2026-10-20"
      review_status: author-draft
      version: 1.0.0
      contributor_notes: >
        Not confirmed whether this was appealed further past this Court of
        Appeals decision.
      sourceProvenance: Tennessee Court of Appeals opinion (Justia), fetched and read directly.

