    label: Governor Austin Peay signs the Butler Act into law
    jurisdiction: US-TN
    eventType: legislation
    dateStart: "1925-03-21"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      Following House passage 71-5 (Jan 28) and Senate passage 24-6 (Mar
      13), Governor Austin Peay signed the Butler Act. Peay said "nothing of
      consequence in the books now being taught in our schools" would run
