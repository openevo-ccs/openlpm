  - id: TNLP-EVENT-aclu-ad-and-scopes-recruitment
    slug: aclu-ad-and-scopes-recruitment
    label: ACLU advertises for a test-case teacher; Dayton boosters recruit John Scopes
    jurisdiction: US-TN
    eventType: advocacy-campaign
    dateStart: "1925-05-04"
    dateGranularity: day
    temporalStatus: past-completed
    description: >
      The ACLU's newspaper advertisement (reported in the Chattanooga Times)
      offered to defend any Tennessee teacher willing to test the Butler
      Act. George Rappleyea, a Dayton engineer and civic booster, convinced
      a group of Dayton businessmen at Robinson's Drug Store to recruit John
      T. Scopes, a local substitute teacher/football coach, as the test
      defendant -- explicitly to generate publicity and business for the
      town.
    involvedActors: [TNLP-ACTOR-aclu]
