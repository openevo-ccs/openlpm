  - id: TNLP-EVENT-haslam-lets-teacher-protection-act-become-law
    slug: haslam-lets-teacher-protection-act-become-law
    label: Governor Haslam lets the Teacher Protection Act become law without his signature
    jurisdiction: US-TN
    eventType: legislation
    dateStart: "2012-04-10"
